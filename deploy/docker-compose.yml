# SnapSell hosting: two processes on one box.
#
#   caddy    public entry point. Terminates HTTPS (Let's Encrypt, automatic) for
#            SNAPSELL_DOMAIN and proxies to the backend. The phone apps require
#            https, so this is not optional on a real host.
#   backend  the FastAPI service from ../backend, reachable only from caddy.
#
#   cp .env.example .env && edit it
#   docker compose up -d --build
#   curl https://$SNAPSELL_DOMAIN/health
services:
  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8000"
      # Firebase Admin credentials, mounted below. Leave GOOGLE_APPLICATION_CREDENTIALS
      # unset in .env when SNAPSELL_AUTH_DISABLED=1 (local testing only).
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - ./firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file: .env
    ports:
      - "${SNAPSELL_HTTP_PORT:-80}:80"
      - "${SNAPSELL_HTTPS_PORT:-443}:443"
      - "${SNAPSELL_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
