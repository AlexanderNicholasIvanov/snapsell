name: android

on:
  push:
    paths: ["android/**", "contracts/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "contracts/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      # gradle.properties pins org.gradle.java.home to a Homebrew path for local
      # builds; CI overrides it with the JDK setup-java installed.
      - run: ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v7
        with:
          name: snapsell-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
