[project]
name = "snapsell-backend"
version = "0.1.0"
description = "SnapSell backend: identifies items from photos with Claude and prices them from eBay comps."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "anthropic>=1.5.0",
    "firebase-admin>=7.5.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "anyio>=4.15.1",
    "jsonschema>=4.26.0",
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snapsell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is declared in defaults by design.
extend-immutable-calls = ["fastapi.Depends"]
