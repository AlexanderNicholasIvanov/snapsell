# Railway config-as-code for the backend service (https://docs.railway.com/reference/config-as-code).
# From ./backend: `railway login && railway init && railway up`, then set the
# variables from .env.example in the service settings and add a public domain.
# Railway terminates HTTPS itself, so no reverse proxy is needed there.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
