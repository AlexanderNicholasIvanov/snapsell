org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Left off until the project builds cleanly: configuration cache plus KSP
# is a common source of first-sync friction.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# Pin the build JDK so Android Studio and the terminal cannot diverge.
# This pins the Gradle DAEMON only; the ./gradlew launcher still needs some
# java on PATH or JAVA_HOME to start.
org.gradle.java.home=/opt/homebrew/opt/openjdk@21

org.gradle.tooling.parallel=true
