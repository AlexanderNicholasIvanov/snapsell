# XcodeGen spec. `xcodegen generate` writes SnapSell.xcodeproj (gitignored).
name: SnapSell
options:
  bundleIdPrefix: com.alexivanov
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# Versions verified against GitHub releases on 2026-09-15.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.19.1
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.0.0

targets:
  SnapSell:
    type: application
    platform: iOS
    sources:
      - path: SnapSell
        excludes:
          - "Resources/GoogleService-Info.plist.example"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: SnapSell/SnapSell.entitlements
    info:
      path: SnapSell/Info.plist
      properties:
        CFBundleDisplayName: SnapSell
        CFBundleName: SnapSell
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: SnapSell photographs the items you want to sell. Nothing is uploaded until you confirm what to sell.
        NSPhotoLibraryUsageDescription: SnapSell saves listing photos to a "Resale" album so you can pick them in Facebook Marketplace.
        NSPhotoLibraryAddUsageDescription: SnapSell saves listing photos to a "Resale" album so you can pick them in Facebook Marketplace.
        LSApplicationQueriesSchemes: [fb]
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: google-sign-in
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        UIAppFonts:
          - archivo_regular.ttf
          - archivo_semibold.ttf
          - archivo_extrabold.ttf
        NSAppTransportSecurity:
          # Home-network backends over plain http (see android README). Cloud Run is https.
          NSAllowsLocalNetworking: true
        SnapSellBackendURL: $(SNAPSELL_BACKEND_URL)
        GoogleReversedClientID: $(GOOGLE_REVERSED_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO

  SnapSellTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SnapSellTests
    dependencies:
      - target: SnapSell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victorivanov.snapsell.tests
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        # The contracts folder is read at test time from the repo checkout.
        SNAPSELL_CONTRACTS_DIR: $(SRCROOT)/../contracts
    info:
      path: SnapSellTests/Info.plist
      properties:
        SnapSellContractsDir: $(SNAPSELL_CONTRACTS_DIR)

schemes:
  SnapSell:
    build:
      targets:
        SnapSell: all
        SnapSellTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SnapSellTests]
    archive:
      config: Release
